name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: product_analytics
          POSTGRES_USER: product_analytics
          POSTGRES_PASSWORD: product_analytics
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U product_analytics -d product_analytics"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://product_analytics:product_analytics@127.0.0.1:5432/product_analytics?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Go tests
        run: go test ./...

      - name: Go vet
        run: go vet ./...

      - name: Web tests
        run: node --test web/sdk.test.cjs web/app.test.cjs

      - name: Build
        run: make build

      - name: Integration tests (race detector)
        run: make integration-test

      - name: Validate compose file (optional)
        continue-on-error: true
        env:
          POSTGRES_PASSWORD: ci-only-password
          PULSE_ADMIN_TOKEN: ci-only-token
        run: |
          if command -v docker >/dev/null 2>&1 && docker compose version >/dev/null 2>&1; then
            docker compose config --quiet
          else
            echo 'docker compose is unavailable; skipping compose validation.'
          fi
